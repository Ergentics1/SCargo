[workspace]
resolver = "2"
members = [
    "crates/scargo-probe",
    "crates/scargo-trace",
    "crates/scargo-qualify",
    "crates/scargo-riem-lattice",
    "crates/scargo-schwartz-zippel",
    "crates/scargo-sweep",
    "crates/scargo-ground",
    "crates/scargo-airlock",
    "crates/scargo-census",
    "crates/scargo-emit",
    "crates/scargo-patch",
    "crates/scargo-rehearsal",
    "crates/scargo-synth",
]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
deprecated = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "thin"
