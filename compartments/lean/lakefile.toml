name = "scargo_lean"
version = "0.1.0"
defaultTargets = ["SCargoLean"]
testDriver = "riem_lattice_test"

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true
linter.deprecated = true
linter.unusedVariables = true

[[lean_lib]]
name = "SCargoLean"
roots = ["SCargoLean"]

[[lean_exe]]
name = "riem_lattice_test"
root = "SCargoLean.RiemLatticeTest"

[[lean_exe]]
name = "sz_lattice_test"
root = "SCargoLean.SchwartzZippelTest"

[[lean_exe]]
name = "sweep_witness_test"
root = "SCargoLean.SweepWitnessTest"

[[lean_exe]]
name = "ground_codec_test"
root = "SCargoLean.GroundCodecTest"

[[lean_exe]]
name = "transfer_airlock_test"
root = "SCargoLean.TransferAirlockTest"
